---
path:
  - bin/
  - src/
  - tests/
extensions:
  - php
exclude:
  - .git/
  - .github/
  - .idea/
  - .vscode/
  - .vs/
  - node_modules/
  - coverage/
  - .cache/
  - vendor/
  - __pycache__/
  - bootstrap/
  - cache/
  - packages/
  - lua_modules/
  - resources/
  - schema/
jobs: 1
warning: true
memory-limit: -1
no-cache: true
progress: PROGRESS
