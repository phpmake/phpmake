---
name: Build and Test

permissions:
  contents: read

"on":
  push:
    paths-ignore:
      - "*.md"
    branches:
      - main
  pull_request:
    paths-ignore:
      - "*.md"
    branches:
      - main
  workflow_dispatch:

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 300  # Seconds.

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Update platform's packages database
        run: sudo apt-get update

      - name: Install platform tools
        run: sudo apt-get install -y libxml2-utils yamllint jq

      - name: Clone project
        uses: actions/checkout@v7

      - name: Lint YAML files
        run: |
          find . -type f -name "*.yml" -not -path "./vendor/*" \
            -not -path "./.git/*" -exec yamllint {} +

      - name: Lint XML files
        run: |
          find . -type f -name "*.xml" -not -path "./vendor/*" \
            -not -path "./.git/*" -exec xmllint --noout {} \;

      - name: Lint JSON files
        run: |
          find . -type f -name "*.json" -not -path "./vendor/*" \
            -not -path "./.git/*" -exec sh -c 'jq empty "$0"' {} \;

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: zip
          tools: composer:v2
          ini-values: memory_limit=256M, zend.assertions=1, \
            error_reporting=-1, display_errors=On

      - name: Lint PHP files
        run: |
          set -e
          set -o nounset
          set -o errexit
          set -o pipefail
          find . -path ./vendor -prune -o -name "*.php" -print0 \
            | xargs -0 -n 1 php -l

      - name: Validate manifest file
        run: composer validate --strict

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: >-
            ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint codes
        run: composer lint

      - name: Run PHPStan static analysis
        run: composer analyse

      - name: Verify POSIX process-group fallback without ext-posix
        run: php -n tests/Support/PosixProcessGroupFallbackSmoke.php

      - name: Check code formatting
        run: composer format-check

      - name: Check Rector rules
        run: composer refactor-check

      - name: Check unused Composer dependencies
        run: vendor/bin/composer-unused

      - name: Check declared Composer requirements
        run: vendor/bin/composer-require-checker check

      - name: Check Composer normalization
        run: composer normalize --dry-run

      - name: Run PHPUnit tests
        run: composer test

      - name: Run performance benchmark
        run: composer benchmark

      - name: Verify clean Composer consumer installation
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          cat > "$consumer/composer.json" <<JSON
          {
            "repositories": [{
              "type": "path",
              "url": "${GITHUB_WORKSPACE}",
              "options": {
                "symlink": false,
                "versions": {"phpmake/phpmake": "2.0.2"}
              }
            }],
            "require": {"phpmake/phpmake": "2.0.2"}
          }
          JSON
          cd "$consumer"
          composer install --no-interaction --no-progress --prefer-dist
          mkdir -p src
          printf '%s\n' '<?php echo "consumer";' > src/index.php
          php vendor/bin/phpmake.php --version
          php vendor/bin/phpmake.php --init
          php vendor/bin/phpmake.php --validate-build
          php vendor/bin/phpmake.php
          php vendor/bin/phpmake.php package

      - name: Clear packages cache
        run: composer clear-cache

      - name: Security check
        run: composer audit --abandoned=ignore

      - name: Use tool
        run: php bin/phpmake.php package

      - name: Validate build.json
        run: >-
          php -r ' $config = json_decode(file_get_contents("build.json"), true);
          if (!isset($config["targets"]["package"])) { echo "build.json missing
          'package' target\\n"; exit(1); }'

  php-compatibility:
    name: PHP ${{ matrix.php-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: zip
          tools: composer:v2
          ini-values: >-
            memory_limit=256M, zend.assertions=1,
            error_reporting=-1, display_errors=On

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint PHP
        run: composer lint

      - name: Run tests
        run: composer test

  windows-tests:
    name: Windows Filesystem Tests (PHP ${{ matrix.php-version }})
    runs-on: windows-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.5']

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: zip
          tools: composer:v2
          ini-values: >-
            memory_limit=256M, zend.assertions=1,
            error_reporting=-1, display_errors=On

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit tests
        run: composer test

  macos-tests:
    name: macOS APFS Filesystem Tests (PHP ${{ matrix.php-version }})
    runs-on: macos-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: zip
          tools: composer:v2
          ini-values: >-
            memory_limit=256M, zend.assertions=1,
            error_reporting=-1, display_errors=On

      - name: Create case-sensitive APFS test volume
        shell: bash
        run: |
          set -euo pipefail
          volume="$RUNNER_TEMP/phpmake-case-sensitive.sparsebundle"
          mount="$RUNNER_TEMP/phpmake-case-sensitive"
          mkdir -p "$mount"
          hdiutil create -type SPARSEBUNDLE -fs "Case-sensitive APFS" -size 2g \
            -volname PHPMakeCaseSensitive "$volume"
          hdiutil attach -nobrowse -mountpoint "$mount" "$volume"
          echo "PHPMAKE_APFS_MOUNT=$mount" >> "$GITHUB_ENV"
          echo "PHPMAKE_APFS_VOLUME=$volume" >> "$GITHUB_ENV"

      - name: Install and test on case-sensitive APFS
        shell: bash
        run: |
          set -euo pipefail
          project="$PHPMAKE_APFS_MOUNT/PHPMake"
          mkdir -p "$project"
          ditto "$GITHUB_WORKSPACE" "$project"
          cd "$project"

          touch "$PHPMAKE_APFS_MOUNT/.phpmake-case-probe"
          if [ -e "$PHPMAKE_APFS_MOUNT/.PHPMAKE-CASE-PROBE" ]; then
            echo "The APFS test volume is not case-sensitive." >&2
            exit 1
          fi
          rm "$PHPMAKE_APFS_MOUNT/.phpmake-case-probe"

          composer install --no-interaction --no-progress --prefer-dist
          PHPMAKE_TEST_ROOT="$project/.phpmake-test-tmp" composer test

      - name: Detach case-sensitive APFS test volume
        if: always()
        shell: bash
        run: |
          if [ -n "${PHPMAKE_APFS_MOUNT:-}" ]; then
            hdiutil detach "$PHPMAKE_APFS_MOUNT" -quiet || true
          fi
          rm -rf "$RUNNER_TEMP/phpmake-case-sensitive" \
            "$RUNNER_TEMP/phpmake-case-sensitive.sparsebundle"
