---
name: Build and Test

permissions:
  contents: read

"on":
  push:
    branches:
      - main
    tags:
      - '*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 300  # Seconds.

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Update platform's packages database
        run: sudo apt-get update

      - name: Install platform tools
        run: sudo apt-get install -y libxml2-utils yamllint jq

      - name: Clone project
        uses: actions/checkout@v7

      - name: Lint YAML files
        run: |
          find . -type f -name "*.yml" -not -path "./vendor/*" \
            -not -path "./.git/*" -exec yamllint {} +

      - name: Lint XML files
        run: |
          find . -type f -name "*.xml" -not -path "./vendor/*" \
            -not -path "./.git/*" -exec xmllint --noout {} \;

      - name: Lint JSON files
        run: |
          find . -type f -name "*.json" -not -path "./vendor/*" \
            -not -path "./.git/*" -exec sh -c 'jq empty "$0"' {} \;

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: zip
          tools: composer:v2
          ini-values: memory_limit=256M, zend.assertions=1, \
            error_reporting=-1, display_errors=On

      - name: Lint PHP files
        run: |
          set -e
          set -o nounset
          set -o errexit
          set -o pipefail
          find . \
            \( \
              -path './.git' -o \
              -path './.idea' -o \
              -path './.vscode' -o \
              -path './.vs' -o \
              -path './node_modules' -o \
              -path './coverage' -o \
              -path './.cache' -o \
              -path './vendor' -o \
              -path './__pycache__' -o \
              -path './bootstrap' -o \
              -path './cache' -o \
              -path './packages' -o \
              -path './lua_modules' \
            \) -prune \
            -o -type f -name "*.php" -print0 | xargs -0 -n 1 php -l

      - name: Validate manifest file
        run: composer validate --strict

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: >-
            ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint codes
        run: composer lint

      - name: Run PHPStan static analysis
        run: composer analyse

      - name: Verify POSIX process-group fallback without ext-posix
        run: php -n tests/Support/PosixProcessGroupFallbackSmoke.php

      - name: Check Rector rules
        run: composer refactor-check

      - name: Check unused Composer dependencies
        run: vendor/bin/composer-unused

      - name: Check declared Composer requirements
        run: vendor/bin/composer-require-checker check

      - name: Check Composer normalization
        run: composer normalize --dry-run

      - name: Run PHPUnit tests with per-test diagnostics
        run: composer test -- --testdox

      - name: Verify clean Composer consumer installation
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          cat > "$consumer/composer.json" <<JSON
          {
            "repositories": [{
              "type": "path",
              "url": "${GITHUB_WORKSPACE}",
              "options": {
                "symlink": false,
                "versions": {"phpmake/phpmake": "2.0.2"}
              }
            }],
            "require": {"phpmake/phpmake": "2.0.2"}
          }
          JSON
          cd "$consumer"
          composer install --no-interaction --no-progress --prefer-dist
          mkdir -p src
          printf '%s\n' '<?php echo "consumer";' > src/index.php
          php vendor/bin/phpmake.php --version
          php vendor/bin/phpmake.php --init
          php vendor/bin/phpmake.php --validate-build
          php vendor/bin/phpmake.php
          php vendor/bin/phpmake.php package

      - name: Clear packages cache
        run: composer clear-cache

      - name: Security check
        run: composer audit --abandoned=ignore

      - name: Run packaging smoke test
        run: php bin/phpmake.php package

      - name: Validate build.json
        run: >-
          php -r ' $config = json_decode(file_get_contents("build.json"), true);
          if (!isset($config["targets"]["package"])) { echo "build.json missing
          'package' target\n"; exit(1); }'


  coverage:
    name: PHPUnit Coverage (PHP 8.3)
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup PHP with coverage driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: zip, xdebug
          tools: composer:v2
          ini-values: memory_limit=512M, error_reporting=-1, display_errors=On

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Enable PHPUnit path coverage
        run: |
          composer require --dev --no-interaction --no-progress \
            --with-all-dependencies phpunit/phpunit:^10.5
          sed 's#9.6/phpunit.xsd#10.5/phpunit.xsd#' \
            phpunit.xml > phpunit-coverage.xml

      - name: Generate PHPUnit test and coverage reports
        env:
          XDEBUG_MODE: coverage
        run: |
          mkdir -p build
          vendor/bin/phpunit --configuration phpunit-coverage.xml \
            --path-coverage \
            --log-junit=build/junit.xml \
            --coverage-clover=build/coverage.xml \
            --coverage-html=build/coverage-html \
            --coverage-text

      - name: Enforce line and critical-path coverage
        run: |
          php <<'PHP'
          <?php
          $report = is_file('build/coverage.xml')
              ? simplexml_load_file('build/coverage.xml')
              : false;
          if ($report === false || !isset($report->project->metrics)) {
              fwrite(STDERR, "Missing or invalid Clover coverage report.\n");
              exit(1);
          }

          $metrics = $report->project->metrics;
          $total = (int) $metrics['statements'];
          $covered = (int) $metrics['coveredstatements'];
          $branches = (int) $metrics['conditionals'];
          $coveredBranches = (int) $metrics['coveredconditionals'];
          if ($total < 1 || $covered < 0 || $covered > $total
              || $branches < 1
              || $coveredBranches < 0
              || $coveredBranches > $branches) {
              fwrite(
                  STDERR,
                  "Clover coverage metrics are missing or invalid.\n"
              );
              exit(1);
          }

          $lineCoverage = ($covered / $total) * 100;
          printf(
              "Line coverage: %.2f%% (%d/%d); required: 80.00%%\n",
              $lineCoverage,
              $covered,
              $total
          );
          printf(
              "Branch coverage: %.2f%% (%d/%d)\n",
              ($coveredBranches / $branches) * 100,
              $coveredBranches,
              $branches
          );
          if ($lineCoverage + 0.000001 < 80.0) {
              fwrite(
                  STDERR,
                  "Coverage gate failed: overall line coverage is below 80%.\n"
              );
              exit(1);
          }

          $critical = [
              'src/Build/BuildExecutor.php',
              'src/Build/BuildValidator.php',
              'src/Cli/CliParser.php',
              'src/Process/CommandLineParser.php',
              'src/Process/WindowsProcessLauncher.php',
              'src/Target/DependencyResolver.php',
              'src/Task/TaskDefinitionRegistry.php',
          ];
          $found = [];
          foreach ($report->project->package as $package) {
              foreach ($package->file as $file) {
                  $name = str_replace('\\', '/', (string) $file['name']);
                  foreach ($critical as $required) {
                      if (substr($name, -strlen($required)) === $required) {
                          $fileMetrics = $file->metrics;
                          $found[$required] = [
                              (int) $fileMetrics['statements'],
                              (int) $fileMetrics['coveredstatements'],
                          ];
                      }
                  }
              }
          }

          $failed = false;
          foreach ($critical as $required) {
              if (!isset($found[$required])) {
                  fwrite(
                      STDERR,
                      "Missing critical coverage entry: {$required}\n"
                  );
                  $failed = true;
                  continue;
              }
              [$fileTotal, $fileCovered] = $found[$required];
              printf(
                  "Critical: %s — %d/%d\n",
                  $required,
                  $fileCovered,
                  $fileTotal
              );
              if ($fileTotal < 1 || $fileCovered !== $fileTotal) {
                  $failed = true;
              }
          }
          if ($failed) {
              fwrite(
                  STDERR,
                  "Coverage gate failed: all critical files require "
                  . "100% line coverage.\n"
              );
              exit(1);
          }
          echo "Coverage requirements satisfied.\n";
          PHP

      - name: Publish coverage summary
        shell: bash
        run: |
          php -r '
          $xml = simplexml_load_file("build/coverage.xml");
          if ($xml === false || !isset($xml->project->metrics)) {
              fwrite(STDERR, "Invalid or missing Clover coverage metrics.\n");
              exit(1);
          }
          $metrics = $xml->project->metrics;
          $statements = (int) $metrics["statements"];
          $covered = (int) $metrics["coveredstatements"];
          if ($statements < 1 || $covered < 0 || $covered > $statements) {
              fwrite(STDERR, "Invalid Clover statement metrics.\n");
              exit(1);
          }
          $conditionals = (int) $metrics["conditionals"];
          $coveredConditionals = (int) $metrics["coveredconditionals"];
          if (
              $conditionals < 1
              || $coveredConditionals < 0
              || $coveredConditionals > $conditionals
          ) {
              fwrite(STDERR, "Invalid Clover branch metrics.\n");
              exit(1);
          }
          $percentage = number_format(($covered / $statements) * 100, 2);
          $branchPercentage = number_format(
              ($coveredConditionals / $conditionals) * 100,
              2
          );
          file_put_contents(
              getenv("GITHUB_STEP_SUMMARY"),
              "## PHPUnit coverage\n\n"
              . "| Metric | Result |\n|---|---:|\n"
              . "| Covered statements | {$covered} / {$statements} |\n"
              . "| Line coverage | {$percentage}% (minimum 80%) |\n"
              . "| Covered branches | "
              . "{$coveredConditionals} / {$conditionals} |\n"
              . "| Branch coverage | {$branchPercentage}% |\n"
          );
          '

      - name: Upload PHPUnit reports
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-reports
          path: |
            build/junit.xml
            build/coverage.xml
            build/coverage-html/
          if-no-files-found: error
          retention-days: 14

  php-compatibility:
    name: PHP ${{ matrix.php-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: zip
          tools: composer:v2
          ini-values: >-
            memory_limit=256M, zend.assertions=1,
            error_reporting=-1, display_errors=On

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint PHP
        run: composer lint

      - name: Run tests
        run: composer test

  windows-tests:
    name: Windows Filesystem Tests (PHP ${{ matrix.php-version }})
    runs-on: windows-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: zip
          tools: composer:v2
          ini-values: >-
            memory_limit=256M, zend.assertions=1,
            error_reporting=-1, display_errors=On

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit tests with active-test diagnostics
        run: composer test -- --debug --testdox

  release:
    name: Validate and Publish Release
    if: >-
      startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - coverage
      - php-compatibility
      - windows-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$tag" =~ $semver_pattern ]]; then
            echo "::error::Release tags must use strict stable SemVer."
            exit 1
          fi

          empty_sha="0000000000000000000000000000000000000000"
          if [[ "$RELEASE_EVENT_BEFORE" != "$empty_sha" ]]; then
            echo "::error::Refusing to publish an updated or replaced tag."
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for this tag."
            exit 1
          fi

          if [[ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]]; then
            echo "::error::Release tags must be annotated Git tags."
            exit 1
          fi

          version="$(tr -d '\r\n' < VERSION.txt)"
          config_version="$(
            sed -nE \
              "s/^[[:space:]]*public const TOOL_VERSION = '([^']+)';$/\1/p" \
              src/Config.php
          )"
          if [[ -z "$config_version" \
            || "$tag" != "$version" \
            || "$tag" != "$config_version" ]]; then
            echo "::error::Tag, VERSION.txt, and config version must match."
            exit 1
          fi

          if ! awk -v heading="PHPMake $version -" '
            index($0, heading) == 1 { found = 1 }
            END { exit !found }
          ' documents/CHANGELOG.txt; then
            echo "::error::The changelog has no section for $version."
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The release tag must be reachable from main."
            exit 1
          fi

      - name: Prepare release notes and source archives
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          mkdir -p dist

          awk -v version="$version" '
            index($0, "PHPMake " version " -") == 1 {
              found = 1
              next
            }
            found && index($0, "PHPMake ") == 1 {
              exit
            }
            found {
              print
            }
            END {
              if (!found) {
                exit 1
              }
            }
          ' documents/CHANGELOG.txt > dist/release-notes.md

          if [[ ! -s dist/release-notes.md ]]; then
            echo "::error::The release changelog section is empty."
            exit 1
          fi

          git archive --format=tar \
            --prefix="phpmake-${version}/" \
            "$GITHUB_SHA" | gzip -n > "dist/phpmake-${version}.tar.gz"
          git archive --format=zip \
            --prefix="phpmake-${version}/" \
            "$GITHUB_SHA" > "dist/phpmake-${version}.zip"

          (
            cd dist
            sha256sum "phpmake-${version}.tar.gz" "phpmake-${version}.zip" \
              > SHA256SUMS
          )

          {
            printf 'Package: phpmake/phpmake\n'
            printf 'Version: %s\n' "$version"
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Tag: %s\n' "$GITHUB_REF"
            workflow_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            workflow_url="${workflow_url}/actions/runs/${GITHUB_RUN_ID}"
            printf 'Workflow: %s\n' "$workflow_url"
          } > dist/RELEASE-MANIFEST.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "PHPMake ${GITHUB_REF_NAME}" \
            --notes-file dist/release-notes.md \
            "dist/phpmake-${GITHUB_REF_NAME}.tar.gz" \
            "dist/phpmake-${GITHUB_REF_NAME}.zip" \
            dist/SHA256SUMS \
            dist/RELEASE-MANIFEST.txt
